services:

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-staffing}
      POSTGRES_USER: ${DB_USER:-staffing}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-staffing-local}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-staffing} -d ${DB_NAME:-staffing}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: staffing-backend
    command: ["sh", "-c", "python manage.py migrate && if [ -f /imports/Staff.csv ] && [ -f /imports/Assignments.csv ]; then python manage.py import_staffing_csvs --staff-csv /imports/Staff.csv --assignments-csv /imports/Assignments.csv --replace || echo 'IMPORTACION FALLIDA: se conservan los datos anteriores'; else echo 'CSV no encontrados: se omite la importacion'; fi; python manage.py runserver 0.0.0.0:8000"]
    ports:
      - "8000:8000"
      - "5432:5432"
    volumes:
      - ./backend:/app
      # Por defecto datos inventados; para los reales: CSV_DIR=. docker compose up
      - ${CSV_DIR:-./backend/sample-data}/Staff.csv:/imports/Staff.csv:ro
      - ${CSV_DIR:-./backend/sample-data}/Assignments.csv:/imports/Assignments.csv:ro
    environment:
      DJANGO_DEBUG: ${DJANGO_DEBUG:-true}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
      DB_NAME: ${DB_NAME:-staffing}
      DB_USER: ${DB_USER:-staffing}
      DB_PASSWORD: ${DB_PASSWORD:-staffing-local}
      DB_HOST: db
      DB_PORT: 5432
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      target: dev
    container_name: staffing-frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
    depends_on:
      - backend

volumes:
  postgres-data: